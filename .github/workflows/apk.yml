name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Montar o projeto Android
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/floresta/eterna app/src/main/res/mipmap-xxxhdpi
          cp index.html app/src/main/assets/index.html
          ICON='android:icon="@mipmap/ic_launcher"'
          if [ -f icone.png ]; then cp icone.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png; else ICON=''; fi

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FlorestaEterna"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.floresta.eterna'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.floresta.eterna'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Floresta Eterna" $ICON android:hardwareAccelerated="true"
                android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true"
                  android:screenOrientation="portrait"
                  android:configChanges="orientation|screenSize|keyboardHidden|screenLayout">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/floresta/eterna/MainActivity.java <<'EOF'
          package com.floresta.eterna;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient());
                  web.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  setContentView(web);
                  hideBars();
                  if (state != null) web.restoreState(state);
                  else web.loadUrl("file:///android_asset/index.html");
              }

              @SuppressWarnings("deprecation")
              private void hideBars() {
                  web.setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              protected void onPause() { super.onPause(); web.onPause(); }

              @Override
              protected void onResume() { super.onResume(); web.onResume(); }

              @SuppressWarnings("deprecation")
              @Override
              public void onBackPressed() {
                  web.evaluateJavascript(
                      "(function(){if(typeof mode!=='undefined'&&mode==='play'){document.getElementById('pauseBtn').click();return 1}return 0})()",
                      result -> { if (!"1".equals(result)) finish(); });
              }
          }
          EOF

      - name: Compilar o APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk FlorestaEterna.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FlorestaEterna-APK
          path: FlorestaEterna.apk
