name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Montar o projeto Android
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/floresta/eterna app/src/main/res/mipmap-xxxhdpi
          cp index.html app/src/main/assets/index.html
          ICON='android:icon="@mipmap/ic_launcher"'
          if [ -f icone.png ]; then cp icone.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png; else ICON=''; fi

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FlorestaEterna"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.floresta.eterna'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.floresta.eterna'
                  minSdk 21
                  targetSdk 34
                  versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
                  versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:label="Floresta Eterna" $ICON android:hardwareAccelerated="true" android:largeHeap="true" android:resizeableActivity="false"
                android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true"
                  android:screenOrientation="portrait"
                  android:configChanges="orientation|screenSize|smallestScreenSize|keyboardHidden|keyboard|navigation|screenLayout|uiMode|density">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/floresta/eterna/MainActivity.java <<'EOF'
          package com.floresta.eterna;

          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.DisplayCutout;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private WebView web;
              private FrameLayout root;
              private float safeTop = 0;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  Window w = getWindow();
                  w.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  // Celulares com notch/furo na tela (Android 9+): usar a tela toda
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = w.getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      w.setAttributes(lp);
                  }
                  root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF07120C);
                  setContentView(root);
                  // Furo da câmera / notch: avisa o jogo quanto espaço deixar no topo
                  root.setOnApplyWindowInsetsListener(new View.OnApplyWindowInsetsListener() {
                      @Override
                      public WindowInsets onApplyWindowInsets(View v, WindowInsets ins) {
                          if (Build.VERSION.SDK_INT >= 28) {
                              DisplayCutout dc = ins.getDisplayCutout();
                              float d = getResources().getDisplayMetrics().density;
                              safeTop = dc != null ? dc.getSafeInsetTop() / d : 0;
                              pushSafe();
                          }
                          return ins;
                      }
                  });
                  try {
                      createWeb();
                  } catch (Throwable t) {
                      // Sem WebView instalado/ativado no aparelho
                      TextView tv = new TextView(this);
                      tv.setText("Floresta Eterna precisa do \"Android System WebView\".\n\nAtive ou atualize ele na Play Store e abra o jogo de novo.");
                      tv.setTextColor(0xFFFFD24A);
                      tv.setTextSize(18);
                      tv.setPadding(48, 48, 48, 48);
                      root.addView(tv);
                      return;
                  }
                  hideBars();
                  if (state != null && web.restoreState(state) != null) { /* restaurado */ }
                  else web.loadUrl("file:///android_asset/index.html");
              }

              private void createWeb() {
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF07120C);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setTextZoom(100); // ignora o "tamanho da fonte" do Android, que quebrava o layout
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setLoadWithOverviewMode(false);
                  s.setUseWideViewPort(true);
                  s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  web.setVerticalScrollBarEnabled(false);
                  web.setHorizontalScrollBarEnabled(false);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) { pushSafe(); }

                      @Override
                      public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {
                          // Android 8+: se o motor do WebView cair por falta de memória, recria em vez de fechar o app
                          recreateWeb();
                          return true;
                      }
                  });
                  web.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  root.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              }

              private void pushSafe() {
                  if (web != null && Build.VERSION.SDK_INT >= 19)
                      web.evaluateJavascript("window.__safeTop=" + safeTop + ";", null);
              }

              private void recreateWeb() {
                  try {
                      if (web != null) { root.removeView(web); web.destroy(); }
                      createWeb();
                      web.loadUrl("file:///android_asset/index.html");
                      hideBars();
                  } catch (Throwable t) { finish(); }
              }

              @SuppressWarnings("deprecation")
              private void hideBars() {
                  if (web == null) return;
                  if (Build.VERSION.SDK_INT >= 30) {
                      Window w = getWindow();
                      w.setDecorFitsSystemWindows(false);
                      WindowInsetsController c = w.getInsetsController();
                      if (c != null) {
                          c.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  if (web != null) web.saveState(out);
              }

              @Override
              protected void onPause() { super.onPause(); if (web != null) web.onPause(); }

              @Override
              protected void onResume() { super.onResume(); if (web != null) { web.onResume(); hideBars(); } }

              @Override
              protected void onDestroy() {
                  if (web != null) { root.removeView(web); web.destroy(); web = null; }
                  super.onDestroy();
              }

              @SuppressWarnings("deprecation")
              @Override
              public void onBackPressed() {
                  if (web == null) { finish(); return; }
                  web.evaluateJavascript(
                      "(function(){if(typeof mode!=='undefined'&&mode==='play'){document.getElementById('pauseBtn').click();return 1}return 0})()",
                      new android.webkit.ValueCallback<String>() {
                          @Override public void onReceiveValue(String result) { if (!"1".equals(result)) finish(); }
                      });
              }
          }
          EOF

      - name: Compilar o APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk FlorestaEterna.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FlorestaEterna-APK
          path: FlorestaEterna.apk
